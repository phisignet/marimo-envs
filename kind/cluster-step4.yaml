# kind クラスタ設定 — Step 4(複数人 PoC)。
#
# Model Y: 公開ポートは nginx 前段の :80 のみ。
# patched marimo(ACP WS を相対パス /[nbN/]acp/<id> に変更済み)により、ACP は
# :80 経由でパス振り分けされるため、ACP 専用ポート(3017/3021/3025)の bind は不要。
# Step 1 も nginx 前段(:80)経由になったため、旧 2718 直 bind も廃止。
#
# ⚠️ ホスト :80 が他プロセスに使われていると kind create cluster が
# 「port is already allocated」で失敗する。:80 を空けてから実行すること。
#
# Step 1↔Step 4 の切替は teardown.sh で再作成すること(本リポジトリの方針)。
# 注: 現状 step1/step4 の kind 設定は同一(:80 のみ)だが、将来の差分(例: step4 で
# 追加ポート)に備えて別ファイルのまま保持している。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: marimo
nodes:
  - role: control-plane
    extraPortMappings:
      # nginx 前段の HTTP/WS(marimo UI + ACP) - ホスト 80 → ノード(NodePort) 30080
      - containerPort: 30080
        hostPort: 80
        listenAddress: "0.0.0.0"
        protocol: TCP
