# kind クラスタ設定 — Step 4(複数人 PoC、全 agent 対応)。
#
# nginx 前段が :80(marimo UI) と :3017 or :3021 or :3025(ACP)を bind する。
# Claude / Codex / Copilot のどれでも切替できるよう、3 ACP ポート全部を bind
# しておく(Pod 側は選んだ agent のポートしか listen しないので余分に open
# しても通信上の害はない)。これにより bootstrap.sh の --agent 切替時に
# kind cluster 自体は再作成不要。
#
# ⚠️ ただし `extraPortMappings` の hostPort が既にホスト側で他プロセスに
# 使われている場合、未使用予定の側であっても kind create cluster は
# 「port is already allocated」で失敗する。:80 + 3 ACP ポート(3017/3021/3025)
# が空いていることが前提。回避策:
#   - 使わない agent のポートを bind する extraPortMappings エントリを
#     削除して使う(限定 agent 運用になり、他 agent への切替時は
#     teardown → 再作成が必要)
#   - もしくはホスト側の競合プロセスを停止 / ポート変更する
#
# Step 1 用設定(kind/cluster-step1.yaml)と分けている理由:
# - Step 4 はホスト :80 を bind するため、Step 1 だけ使いたいユーザーが
#   :80 占有環境にいる場合に巻き添えで kind create が落ちないよう分離。
# Step 1↔Step 4 の切替は teardown.sh で再作成すること(本リポジトリの方針)。
#
# 重要(設計の核心): marimoのACPエージェントは、ブラウザが
# window.location.hostname:<agent固有port> にハードコードで直結する仕様
# (`frontend/src/components/chat/acp/state.ts` の getAgentWebSocketUrl)。
# Step 4 では nginx 前段が :80 と ACP の port を受けて Host ヘッダで Pod を振り分け。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: marimo
nodes:
  - role: control-plane
    extraPortMappings:
      # nginx 前段の HTTP/WS(marimo UI) - ホスト 80 → ノード(NodePort) 30080
      - containerPort: 30080
        hostPort: 80
        listenAddress: "0.0.0.0"
        protocol: TCP

      # ACPエージェント(Claude Code) - ホスト 3017 → ノード(NodePort) 30317
      - containerPort: 30317
        hostPort: 3017
        listenAddress: "0.0.0.0"
        protocol: TCP

      # ACPエージェント(Codex CLI) - ホスト 3021 → ノード(NodePort) 30321
      - containerPort: 30321
        hostPort: 3021
        listenAddress: "0.0.0.0"
        protocol: TCP

      # ACPエージェント(Copilot CLI、Cursor port 3025 を流用) - ホスト 3025 → ノード 30325
      - containerPort: 30325
        hostPort: 3025
        listenAddress: "0.0.0.0"
        protocol: TCP
