# kind クラスタ設定 — Step 1(1人用、両 agent 対応)。
#
# Claude (port 3017) と Codex (port 3021) のどちらでも切替できるよう、
# 両ポートを bind しておく(Pod 側は選んだ agent のポートしか listen しないので
# 余分に open しても通信上の害はない)。これにより bootstrap.sh の --agent 切替時に
# kind cluster 自体は再作成不要(Service だけ apply し直せばよい)。
#
# ⚠️ ただし `extraPortMappings` の hostPort が既にホスト側で他プロセスに
# 使われている場合、未使用予定の側であっても kind create cluster は
# 「port is already allocated」で失敗する。両 ACP ポート(3017/3021)+ marimo (2718)
# が空いていることが前提。回避策:
#   - 使わない側の agent のポートを bind する `- {containerPort: 3017/3021, ...}`
#     行を削除して使う(片 agent 固定運用になり、もう片方への切替時は
#     teardown → 再作成が必要)
#   - もしくはホスト側の競合プロセスを停止 / ポート変更する
#
# Step 4 用設定(kind/cluster-step4.yaml)と分けている理由:
# - Step 4 はホスト :80 を bind するため、:80 が他用途で使われている環境で
#   Step 1 ユーザーが共通設定を使うと kind create がいきなり失敗する。
# - Step 1 では :80 をそもそも使わないので、開けないことで巻き添えを防ぐ。
# Step 1↔Step 4 の切替は teardown.sh で再作成すること(本リポジトリの方針)。
#
# 重要(設計の核心): marimoのACPエージェントは、ブラウザが
# window.location.hostname:<agent固有port> にハードコードで直結する仕様
# (`frontend/src/components/chat/acp/state.ts` の getAgentWebSocketUrl)。
# そのため marimo の UI (2718) と ACP の port を「同一ホスト名/IPで」LAN に
# 同時公開する必要がある。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: marimo
nodes:
  - role: control-plane
    extraPortMappings:
      # marimo UI/サーバWS - ホスト 2718 → ノード(NodePort) 30718
      - containerPort: 30718
        hostPort: 2718
        listenAddress: "0.0.0.0"
        protocol: TCP

      # ACPエージェント(Claude Code) - ホスト 3017 → ノード(NodePort) 30317
      - containerPort: 30317
        hostPort: 3017
        listenAddress: "0.0.0.0"
        protocol: TCP

      # ACPエージェント(Codex CLI) - ホスト 3021 → ノード(NodePort) 30321
      - containerPort: 30321
        hostPort: 3021
        listenAddress: "0.0.0.0"
        protocol: TCP
