# kind クラスタ設定。Step 1(1人での試用)向け。
#
# 重要: marimoのACPエージェント(Claude Code = ポート3017)は、ブラウザが
#       window.location.hostname:3017 にハードコードで直結する仕様
#       (`frontend/src/components/chat/acp/state.ts` の getAgentWebSocketUrl)。
#       そのため marimo の 2718 と ACP の 3017 を同一ホスト名/IPで
#       LAN に同時公開する必要がある。
#
# 戦略: kind の extraPortMappings で listenAddress: "0.0.0.0" 指定し、
#       ホストの 2718 と 3017 を、NodePort範囲(30000-32767)内に確保した
#       30718 / 30317 にそれぞれマップする。
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: marimo
nodes:
  - role: control-plane
    extraPortMappings:
      # marimo UI/サーバWS: ホスト 2718 → ノード(NodePort) 30718
      - containerPort: 30718
        hostPort: 2718
        listenAddress: "0.0.0.0"
        protocol: TCP
      # ACPエージェント(claude-code-acp): ホスト 3017 → ノード(NodePort) 30317
      - containerPort: 30317
        hostPort: 3017
        listenAddress: "0.0.0.0"
        protocol: TCP
