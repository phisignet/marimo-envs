# Step 1 / nginx-gateway: 唯一の公開ポート :80。
# marimo(:2718)と ACP サイドカー(:<port>)を同一オリジンに束ね、パスで振り分ける
# (Model Y)。設定は nginx-configmap.yaml をマウント。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
  namespace: marimo
spec:
  replicas: 1
  selector:
    matchLabels: {app: nginx-gateway}
  template:
    metadata:
      labels: {app: nginx-gateway}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27.5-alpine
          ports:
            - {name: http, containerPort: 80, protocol: TCP}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {memory: "256Mi"}
      volumes:
        - name: conf
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway
  namespace: marimo
spec:
  type: NodePort
  selector: {app: nginx-gateway}
  ports:
    # ホスト側 80 → kind: node:30080 → nginx :80
    - {name: http, port: 80, targetPort: http, nodePort: 30080, protocol: TCP}
