# Step 1 / codex Service: marimo UI と Codex ACP を同一ホストで外に出す。
#
# 設計の核心: marimoブラウザJSが ACP WebSocket URL を
# `ws://${window.location.hostname}:3021/message` でハードコード(Codex 固定 port)。
# 結果として「同じホスト」の 2718 と 3021 を NodePort で並べる必要がある。
#
# kind 側の extraPortMappings (kind/cluster-step1.yaml の 30718 / 30321) と
# nodePort 値を一致させること。
apiVersion: v1
kind: Service
metadata:
  name: marimo
  namespace: marimo
spec:
  type: NodePort
  selector:
    app: marimo
  ports:
    - name: marimo
      port: 2718
      targetPort: marimo
      nodePort: 30718
      protocol: TCP
    - name: acp
      port: 3021
      targetPort: acp
      nodePort: 30321
      protocol: TCP
