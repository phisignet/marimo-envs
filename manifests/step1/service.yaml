# marimo と ACP の両方を「同じホスト」で外に出す Service。
# NodePort で nodePort を明示し、kind 側 extraPortMappings (kind/cluster.yaml) の
# containerPort: 30718 / 30317 と一致させる。
#
# 結果:
#   ホスト:2718 ─→ kindノード:30718 ─→ Pod:2718 (marimo)
#   ホスト:3017 ─→ kindノード:30317 ─→ Pod:3017 (acp-agent)
#
# ブラウザは marimoを開いた hostname:3017 をハードコードで叩くので、
# 上記2行が「同じhostname」で揃うことが本構成の本質。
apiVersion: v1
kind: Service
metadata:
  name: marimo
  namespace: marimo
spec:
  type: NodePort
  selector:
    app: marimo
  ports:
    - name: marimo
      port: 2718
      targetPort: marimo
      nodePort: 30718
      protocol: TCP
    - name: acp
      port: 3017
      targetPort: acp
      nodePort: 30317
      protocol: TCP
