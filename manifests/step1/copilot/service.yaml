# Step 1 / copilot Service: marimo UI と Copilot ACP を同一ホストで外に出す。
#
# 設計の核心: marimoブラウザJSが ACP WebSocket URL を
# `ws://${window.location.hostname}:3025/message` でハードコード(Cursor 固定 port、
# Copilot CLI を流用)。
#
# kind 側の extraPortMappings (kind/cluster-step1.yaml の 30718 / 30325) と
# nodePort 値を一致させること。
apiVersion: v1
kind: Service
metadata:
  name: marimo
  namespace: marimo
spec:
  type: NodePort
  selector:
    app: marimo
  ports:
    - name: marimo
      port: 2718
      targetPort: marimo
      nodePort: 30718
      protocol: TCP
    - name: acp
      port: 3025
      targetPort: acp
      nodePort: 30325
      protocol: TCP
