# Step 1 / copilot Service(ClusterIP)。
#
# Model Y: marimo と ACP は nginx-gateway 経由でのみ触るため内部 Service で十分。
# 外部公開は nginx-gateway(:80 NodePort 30080)が担う。
# - marimo:2718  → marimo UI / 自身の WS
# - acp:3025     → copilot ACP サイドカー(stdio-to-ws /message)
# patched marimo によりフロントは ws(s)://<host>/acp/<id> へ繋ぐ(固定ポート直結は廃止)。
apiVersion: v1
kind: Service
metadata:
  name: marimo
  namespace: marimo
spec:
  type: ClusterIP
  selector:
    app: marimo
  ports:
    - name: marimo
      port: 2718
      targetPort: marimo
      protocol: TCP
    - name: acp
      port: 3025
      targetPort: acp
      protocol: TCP
