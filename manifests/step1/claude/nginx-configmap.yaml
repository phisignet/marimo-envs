# Step 1 / nginx 設定(claude)。単一テナントを :80 で配信。
#
#   /        → marimo:2718(UI + 自身の WS)
#   /acp/<id> → ACP サイドカー:3017 の /message(WebSocket、rewrite で /message 固定)
#
# patched marimo のフロントは ws(s)://<host>/acp/<agentId> へ繋ぐ。pod 内サイドカーは
# 1つなので agentId は経路上不問で全て /message へ中継する。
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: marimo
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }

    http {
      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }

      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
      keepalive_timeout   3600s;

      access_log /dev/stdout combined;
      error_log  /dev/stderr warn;

      server {
        listen 80 default_server;

        # ルート直アクセスは app view 初期表示へ誘導(marimo 組み込みパラメータ)
        if ($request_uri = "/") { return 302 /?view-as=present; }

        # ----- ACP WebSocket(/acp/<id> → サイドカー /message) -----
        # ^~ で /acp/ プレフィックスを確定(下の / より優先)。rewrite で全 URI を
        # /message に固定してから proxy_pass(URI 無し)で送る。
        location ^~ /acp/ {
          rewrite ^ /message break;
          proxy_pass http://marimo.marimo.svc.cluster.local:3017;
          proxy_http_version 1.1;
          proxy_set_header Upgrade    $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host       $host;
        }

        # ----- marimo 本体(UI + 自身の WS。prefix なしの root 配信) -----
        location / {
          proxy_pass http://marimo.marimo.svc.cluster.local:2718;
          proxy_http_version 1.1;
          proxy_set_header Upgrade           $http_upgrade;
          proxy_set_header Connection        $connection_upgrade;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
      }
    }
