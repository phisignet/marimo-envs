# marimoとACPサイドカーが共有する作業ボリューム。
# ノートブックファイル(.py / .md)はここに保存され、再起動を跨いで永続化される。
# ACPエージェントが書き込むファイルもmarimoから即見えるよう、両コンテナで同一パス
# /workspace にマウントする。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: marimo-workspace
  namespace: marimo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # storageClassName を指定しない → kind の標準クラス(rancher.io/local-path)を利用。
