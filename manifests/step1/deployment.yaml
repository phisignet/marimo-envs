# 1Podに marimo と Codex ACPサイドカーを同居させる。
#
# なぜサイドカー構成か:
# 1. ブラウザは ws://window.location.hostname:3021/message にハードコードで繋ぐ
#    (marimo state.ts の Codex 用 port=3021)。
#    → marimoと同じ外部ホストに ACP も居る必要がある(=同一Service)
# 2. ACPエージェントはノートブック実体に読み書きする
#    → marimoと同じファイルシステム(共有PVC、同一パス /workspace)が必要
#
# strategy=Recreate: PVC(RWO)を使うため、Rolling だと新旧Podが同時にマウント不可。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marimo
  namespace: marimo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: marimo
  template:
    metadata:
      labels:
        app: marimo
    spec:
      # 共有PVCを両コンテナのuid 1000で書き込めるよう fsGroup を設定。
      # k8s が PV を chown :1000 + setgid してくれる。
      securityContext:
        fsGroup: 1000

      containers:
        # ---------------------------------------------------------------
        # marimo: ノートブックエディタ本体。公式イメージに marimo[mcp] extras を
        # 追加した派生イメージ(images/marimo/Dockerfile)。CMDは
        #   marimo edit --no-token --mcp [--mcp-allow-remote] -p $PORT --host $HOST
        # の形で、--mcp は常時ON、--mcp-allow-remote は env
        # MARIMO_ALLOW_REMOTE_MCP=1 のときだけ opt-in で付与される(デフォルトOFF)。
        # 通常は PORT/HOST の env だけ上書きすれば --mcp 有効で起動する。
        # ---------------------------------------------------------------
        - name: marimo
          image: marimo-envs/marimo:0.1.0  # ローカルビルド → kind load
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          env:
            - name: PORT
              value: "2718"
            - name: HOST
              value: "0.0.0.0"
          ports:
            - name: marimo
              containerPort: 2718
              protocol: TCP
          volumeMounts:
            - name: workspace
              mountPath: /workspace
          readinessProbe:
            httpGet:
              path: /healthz
              port: marimo
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              memory: "2Gi"

        # ---------------------------------------------------------------
        # codex-acp: stdio-to-ws + codex-acp + Codex CLI。
        # 推論バックエンドは Ollama(OpenAI互換 API)で、認証は不要
        # (config.toml の requires_openai_auth = false でバイパス)。
        # OLLAMA_BASE_URL を env で渡すと entrypoint.sh が ~/.codex/config.toml を
        # 動的生成する。
        # ---------------------------------------------------------------
        - name: codex-acp
          image: marimo-envs/codex-acp:0.1.0  # ローカルビルド → kind load で配置
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          env:
            # bootstrap.sh が env で渡す Ollama エンドポイント。
            # 例: http://192.168.64.32:11434/v1
            - name: OLLAMA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: codex-config
                  key: ollama_base_url
            - name: CODEX_MODEL
              valueFrom:
                configMapKeyRef:
                  name: codex-config
                  key: model
            - name: CODEX_WIRE_API
              valueFrom:
                configMapKeyRef:
                  name: codex-config
                  key: wire_api
          ports:
            - name: acp
              containerPort: 3021
              protocol: TCP
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            # Codex の model catalog を ConfigMap から注入(警告抑制用、
            # Ollama PR #15795 相当の手動組み立て版)。
            # ~/.codex 配下に subPath マウントすると親ディレクトリが root所有で
            # 作られて entrypoint が config.toml を書けなくなるため、別パスに
            # 配置して config.toml の model_catalog_json でパス指定する形にする。
            - name: codex-catalog
              mountPath: /etc/codex-catalog
              readOnly: true
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              memory: "2Gi"

      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: marimo-workspace
        - name: codex-catalog
          configMap:
            name: codex-catalog
