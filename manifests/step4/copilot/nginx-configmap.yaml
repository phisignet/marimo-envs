# Step 4 / nginx 設定(copilot)。Model Y: 単一ホスト/IP・単一 :80 で path-prefix 振り分け。
#
#   /            → 案内(404)
#   /nbN/        → marimo-nbN:2718(--base-url /nbN 配信。UI + 自身の WS)
#   /nbN/acp/<id> → marimo-nbN の ACP サイドカー:3025 の /message(WebSocket)
#
# patched marimo のフロントは ws(s)://<host>/nbN/acp/<agentId> へ繋ぐ(document.baseURI 基準)。
# nip.io / Host 振り分け / ACP 専用ポートは廃止。アクセスは http://<LAN_IP>/nbN/?view-as=present。
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: marimo
data:
  nginx.conf: |
    worker_processes auto;
    events { worker_connections 1024; }

    http {
      map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
      }

      proxy_read_timeout  3600s;
      proxy_send_timeout  3600s;
      keepalive_timeout   3600s;

      access_log /dev/stdout combined;
      error_log  /dev/stderr warn;

      server {
        listen 80 default_server;

        # 各テナントのルートは app view 初期表示へ誘導($request_uri はクエリ込みなのでループしない)
        if ($request_uri = /nb1/) { return 302 /nb1/?view-as=present; }
        if ($request_uri = /nb2/) { return 302 /nb2/?view-as=present; }

        # ----- nb1 -----
        location ^~ /nb1/acp/ {
          rewrite ^ /message break;
          proxy_pass http://marimo-nb1.marimo.svc.cluster.local:3025;
          proxy_http_version 1.1;
          proxy_set_header Upgrade    $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host       $host;
        }
        location ^~ /nb1/ {
          proxy_pass http://marimo-nb1.marimo.svc.cluster.local:2718;
          proxy_http_version 1.1;
          proxy_set_header Upgrade           $http_upgrade;
          proxy_set_header Connection        $connection_upgrade;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ----- nb2 -----
        location ^~ /nb2/acp/ {
          rewrite ^ /message break;
          proxy_pass http://marimo-nb2.marimo.svc.cluster.local:3025;
          proxy_http_version 1.1;
          proxy_set_header Upgrade    $http_upgrade;
          proxy_set_header Connection $connection_upgrade;
          proxy_set_header Host       $host;
        }
        location ^~ /nb2/ {
          proxy_pass http://marimo-nb2.marimo.svc.cluster.local:2718;
          proxy_http_version 1.1;
          proxy_set_header Upgrade           $http_upgrade;
          proxy_set_header Connection        $connection_upgrade;
          proxy_set_header Host              $host;
          proxy_set_header X-Real-IP         $remote_addr;
          proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 不明パス(直 IP / ルート)は案内
        location / {
          return 404 "Use http://<LAN_IP>/nb1/?view-as=present or /nb2/?view-as=present\n";
          default_type text/plain;
        }
      }
    }
