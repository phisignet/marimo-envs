# notebook 環境 #1 (nb1, Copilot CLI) - PVC + Deployment + Service の1セット。
# nb2.yaml は本ファイルの "nb1" を "nb2" に置換しただけのコピー。
#
# Model Y: nginx が path prefix /nb1/ で各テナントへ振り分ける(nip.io 廃止)。
# marimo は --base-url /nb1(MARIMO_BASE_URL)で /nb1/ 配下に配信される。Copilot CLI 版は port 3025、acp は copilot-acp、
# 認証情報は Secret copilot-token(COPILOT_GITHUB_TOKEN)経由。
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: marimo-workspace-nb1
  namespace: marimo
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: marimo-nb1
  namespace: marimo
  labels: {app: marimo, tenant: nb1}
spec:
  replicas: 1
  strategy: {type: Recreate}  # RWO PVCのため
  selector:
    matchLabels: {app: marimo, tenant: nb1}
  template:
    metadata:
      labels: {app: marimo, tenant: nb1}
    spec:
      securityContext: {fsGroup: 1000}
      containers:
        - name: marimo
          image: marimo-envs/marimo:0.1.0
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          env:
            - name: PORT
              value: "2718"
            - name: HOST
              value: "0.0.0.0"
            - name: MARIMO_BASE_URL   # /nb1 配下に配信(Model Y path-prefix)
              value: "/nb1"
          ports:
            - {name: marimo, containerPort: 2718, protocol: TCP}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
          readinessProbe:
            httpGet: {path: /nb1/healthz, port: marimo}
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          resources:
            requests: {cpu: "200m", memory: "512Mi"}
            limits: {memory: "2Gi"}

        - name: copilot-acp
          image: marimo-envs/copilot-acp:0.1.0
          imagePullPolicy: IfNotPresent
          workingDir: /workspace
          env:
            - name: COPILOT_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: copilot-token  # 全テナント共通の1つのSecretを共有
                  key: token
          ports:
            - {name: acp, containerPort: 3025, protocol: TCP}
          volumeMounts:
            - {name: workspace, mountPath: /workspace}
          resources:
            requests: {cpu: "200m", memory: "512Mi"}
            limits: {memory: "2Gi"}

      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: marimo-workspace-nb1
---
apiVersion: v1
kind: Service
metadata:
  name: marimo-nb1
  namespace: marimo
  labels: {app: marimo, tenant: nb1}
spec:
  type: ClusterIP  # nginx 経由でしか触らないので内部 Service で十分
  selector: {app: marimo, tenant: nb1}
  ports:
    - {name: marimo, port: 2718, targetPort: marimo, protocol: TCP}
    - {name: acp,    port: 3025, targetPort: acp,    protocol: TCP}
