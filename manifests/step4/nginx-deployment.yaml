# nginx 前段 Pod。:80 と :3017 を Listen し、Hostヘッダで marimo Pod を振り分ける。
# 設定は nginx-configmap.yaml をマウントして使う。
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-gateway
  namespace: marimo
spec:
  replicas: 1
  selector:
    matchLabels: {app: nginx-gateway}
  template:
    metadata:
      labels: {app: nginx-gateway}
    spec:
      containers:
        - name: nginx
          # Alpine版でサイズ削減、patchまで固定して再現性確保
          # (他コンポーネントも marimo 0.23.8 / stdio-to-ws 0.2.0 等 patch まで pin)。
          # バージョン上げ時は実機で `nginx -v` 確認後に切り替えること。
          image: nginx:1.27.5-alpine
          ports:
            - {name: http, containerPort: 80,   protocol: TCP}
            - {name: acp,  containerPort: 3017, protocol: TCP}
          volumeMounts:
            - {name: conf, mountPath: /etc/nginx/nginx.conf, subPath: nginx.conf, readOnly: true}
          readinessProbe:
            tcpSocket: {port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {memory: "256Mi"}
      volumes:
        - name: conf
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-gateway
  namespace: marimo
spec:
  type: NodePort
  selector: {app: nginx-gateway}
  ports:
    # ホスト側 80   → kind: node:30080 → nginx :80
    - {name: http, port: 80,   targetPort: http, nodePort: 30080, protocol: TCP}
    # ホスト側 3017 → kind: node:30317 → nginx :3017
    - {name: acp,  port: 3017, targetPort: acp,  nodePort: 30317, protocol: TCP}
