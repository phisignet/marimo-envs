# これは参考用。実際は bootstrap.sh が
#   kubectl create secret generic claude-code-token --from-literal=token=...
# で安全に生成するため、このファイルを kubectl apply する必要はない。
# .gitignore で守られていないため、本物のトークンを書き込まないこと。
apiVersion: v1
kind: Secret
metadata:
  name: claude-code-token
  namespace: marimo
type: Opaque
stringData:
  # 取得方法: ブラウザのある手元の端末で
  #   claude setup-token
  # を実行(Claude Pro/Maxサブスクログイン済みであること)、
  # 出力された1年有効のOAuthトークンをここに貼る。
  token: REPLACE_WITH_OUTPUT_OF_claude_setup_token
